name: Build APK

on:
  # जेव्हा मुख्य शाखेत (main branch) बदल होईल तेव्हा हे धावेल
  push:
    branches: [ "main" ]
  # मॅन्युअली धावण्यासाठी पर्याय
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # Gradle बिल्ड सुरू करणे
    - name: Build with Gradle
      run: |
        # Gradle फाईल्स तयार करणे (जर नसतील तर)
        gradle wrapper
        chmod +x gradlew
        # APK तयार करण्याची कमांड
        ./gradlew assembleDebug --stacktrace

    # तयार झालेली APK अपलोड करणे
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DigitalDetox-APK
        path: app/build/outputs/apk/debug/*.apk
        
